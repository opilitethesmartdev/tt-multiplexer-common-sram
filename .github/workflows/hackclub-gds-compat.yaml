name: Hack Club ASIC GF180 hardening compatibility

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PDK: gf180mcuD
      PDK_ROOT: ${{ github.workspace }}/hackclub-asic-pg/.ciel
      PDK_VERSION: 1689ac3f2dc763876eaf967227c7dfe831b031ae
      TT_CONFIG: gf180mcuD.yaml:../../mux_overrides.yaml

    steps:
      - name: Checkout Hack Club ASIC project
        uses: actions/checkout@v6
        with:
          repository: opilitethesmartdev/hackclub-asic-pg
          ref: main
          submodules: recursive
          path: hackclub-asic-pg

      - name: Use this multiplexer revision in the local submodule checkout
        working-directory: hackclub-asic-pg/tt-multiplexer
        run: |
          git fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD
          git fetch --unshallow origin

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          large-packages: false
          docker-images: false
          swap-storage: false
          android: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            hackclub-asic-pg/tt/requirements.txt
            hackclub-asic-pg/tt-multiplexer/py/requirements.txt
            hackclub-asic-pg/verilog/dv/mux/requirements.txt

      - name: Install Python requirements
        working-directory: hackclub-asic-pg
        run: pip install -r tt-multiplexer/py/requirements.txt -r tt/requirements.txt -r verilog/dv/mux/requirements.txt

      - name: Update Caravel configuration
        working-directory: hackclub-asic-pg
        run: python ./tt/configure.py --update-shuttle

      - name: Install Nix and configure FOSSi cache
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=

      - name: Enable GF180 PDK via ciel
        working-directory: hackclub-asic-pg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install ciel==2.5.0
          ciel enable --pdk gf180mcu $PDK_VERSION -l default -l gf180mcu_ocd_io

      - name: Harden Chip ROM
        working-directory: hackclub-asic-pg
        run: nix-shell "$GITHUB_WORKSPACE/hackclub-asic-pg/tt-multiplexer/shell.nix" --run "python -m librelane --manual-pdk tt/rom/config.json"

      - name: Harden tt_ctrl
        working-directory: hackclub-asic-pg/tt-multiplexer/ol2/tt_ctrl
        run: nix-shell "$GITHUB_WORKSPACE/hackclub-asic-pg/tt-multiplexer/shell.nix" --run "python build.py"

      - name: Harden tt_mux
        working-directory: hackclub-asic-pg/tt-multiplexer/ol2/tt_mux
        run: nix-shell "$GITHUB_WORKSPACE/hackclub-asic-pg/tt-multiplexer/shell.nix" --run "python build.py"

      - name: Copy macros
        working-directory: hackclub-asic-pg
        run: python ./tt/configure.py --copy-macros

      - name: Harden tt_top
        working-directory: hackclub-asic-pg/tt-multiplexer/ol2/tt_top
        run: nix-shell "$GITHUB_WORKSPACE/hackclub-asic-pg/tt-multiplexer/shell.nix" --run "python build.py"

      - name: Copy final results
        working-directory: hackclub-asic-pg
        run: python ./tt/configure.py --copy-final-results

      - name: Create foundry submission directory
        working-directory: hackclub-asic-pg
        run: python ./tt/configure.py --create-foundry-submission
